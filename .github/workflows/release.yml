name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # npm provenance attestation
jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./packages/server/package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION — bump versions to match the tag before releasing." >&2
            exit 1
          fi
      # Publishes every non-private workspace package (the two @techgardencode/*)
      # in dependency order. --no-git-checks: tag checkout is detached HEAD.
      # Per ND-46: NPM_CONFIG_PROVENANCE is what actually attaches the provenance
      # attestation — the --provenance CLI flag is a no-op under `pnpm -r`
      # (recursive) publish, which is why v0.1.0 shipped without one. The env var
      # does the work; the flag stays only to document intent (id-token: write
      # above supplies the OIDC token provenance signing needs).
      - run: pnpm -r publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
  # docker-publish: appended when Docker distribution lands (Track 8) — same tag.
